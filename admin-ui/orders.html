<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orders — InjiManjal Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar" id="topbar"></div>
  <div class="container">
    <h2>Orders</h2>
    <div class="card">
      <select id="statusFilter">
        <option value="">All statuses</option>
        <option value="PENDING">Pending</option>
        <option value="PAID">Paid</option>
        <option value="SHIPPED">Shipped</option>
        <option value="DELIVERED">Delivered</option>
        <option value="CANCELLED">Cancelled</option>
      </select>
      <table>
        <thead>
          <tr><th>ID</th><th>Customer</th><th>Total</th><th>Status</th><th>Tracking</th><th>Date</th><th>Actions</th></tr>
        </thead>
        <tbody id="ordersBody"><tr><td colspan="7" class="empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

  <script src="admin.js"></script>
  <script>
    renderTopbar('orders.html');

    async function loadOrders() {
      const status = document.getElementById('statusFilter').value;
      const res = await adminFetch(`/api/x/orders${status ? '?status=' + status : ''}`);
      if (!res) return;
      const { orders } = await res.json();

      const tbody = document.getElementById('ordersBody');
      if (orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty">No orders found</td></tr>';
        return;
      }

      tbody.innerHTML = orders.map(o => `
        <tr>
          <td>#${o.id}</td>
          <td>${o.customers?.name || '—'}<br><small>${o.customers?.email || ''}</small></td>
          <td>₹${o.total}</td>
          <td><span class="badge ${o.status}">${o.status}</span></td>
          <td>${o.tracking_number || '—'}</td>
          <td>${new Date(o.created_at).toLocaleDateString()}</td>
          <td>
            <select onchange="updateStatus(${o.id}, this.value)">
              <option value="">Change status</option>
              <option value="PENDING">Pending</option>
              <option value="PAID">Paid</option>
              <option value="SHIPPED">Shipped</option>
              <option value="DELIVERED">Delivered</option>
              <option value="CANCELLED">Cancelled</option>
            </select>
            <button onclick="addTracking(${o.id})">Add tracking</button>
          </td>
        </tr>
      `).join('');
    }

    async function updateStatus(orderId, status) {
      if (!status) return;
      const res = await adminFetch(`/api/x/orders/${orderId}/status`, {
        method: 'PUT',
        body: JSON.stringify({ status }),
      });
      if (res && res.ok) loadOrders();
    }

    async function addTracking(orderId) {
      const tracking_number = prompt('Enter tracking number:');
      if (!tracking_number) return;
      const res = await adminFetch(`/api/x/orders/${orderId}/tracking`, {
        method: 'PUT',
        body: JSON.stringify({ tracking_number }),
      });
      if (res && res.ok) loadOrders();
    }

    document.getElementById('statusFilter').addEventListener('change', loadOrders);
    loadOrders();
  </script>
</body>
</html>
