<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Products — InjiManjal Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar" id="topbar"></div>
  <div class="container">
    <h2>Products</h2>

    <div class="card">
      <h3>Add Product</h3>
      <form id="addForm">
        <input type="text" id="name" placeholder="Name" required>
        <input type="text" id="slug" placeholder="slug-like-this" required>
        <input type="number" id="price" placeholder="Price" step="0.01" required>
        <input type="number" id="sale_price" placeholder="Sale price (optional)" step="0.01">
        <input type="number" id="stock" placeholder="Stock" required>
        <input type="text" id="category" placeholder="Category">
        <input type="url" id="image_url" placeholder="Image URL">
        <br><br>
        <button type="submit">Add Product</button>
      </form>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>Name</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="productsBody"><tr><td colspan="5" class="empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

  <script src="admin.js"></script>
  <script>
    renderTopbar('products.html');

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;',
      }[character]));
    }

    async function loadProducts() {
      const res = await adminFetch('/api/x/products');
      if (!res) return;
      const { products } = await res.json();

      const tbody = document.getElementById('productsBody');
      if (products.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty">No products yet</td></tr>';
        return;
      }

      tbody.innerHTML = products.map(p => `
        <tr>
          <td>${escapeHtml(p.name)}</td>
          <td>${p.sale_price ? `<s>₹${p.price}</s> ₹${p.sale_price}` : `₹${p.price}`}</td>
          <td>
            <div class="stock-control">
              <input type="number" id="stock-${p.id}" value="${p.stock}" min="0" step="1">
              <button type="button" onclick="updateStock(${p.id})">Update</button>
            </div>
          </td>
          <td>${p.is_active ? 'Active' : 'Inactive'}</td>
          <td>
            <button class="secondary" onclick="toggleProductStatus(${p.id}, ${!p.is_active})">
              ${p.is_active ? 'Deactivate' : 'Activate'}
            </button>
          </td>
        </tr>
      `).join('');
    }

    async function updateStock(id) {
      const input = document.getElementById(`stock-${id}`);
      const stock = parseInt(input.value, 10);
      if (!Number.isInteger(stock) || stock < 0) {
        alert('Enter a valid stock number.');
        return;
      }

      const res = await adminFetch(`/api/x/products/${id}`, {
        method: 'PUT',
        body: JSON.stringify({ stock }),
      });
      if (res && res.ok) {
        loadProducts();
      } else if (res) {
        const err = await res.json();
        alert(err.error || 'Could not update stock');
      }
    }

    async function toggleProductStatus(id, isActive) {
      if (!confirm(`${isActive ? 'Activate' : 'Deactivate'} this product?`)) return;
      const res = await adminFetch(`/api/x/products/${id}`, {
        method: 'PUT',
        body: JSON.stringify({ is_active: isActive }),
      });
      if (res && res.ok) {
        loadProducts();
      } else if (res) {
        const err = await res.json();
        alert(err.error || 'Could not update product status');
      }
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        name: document.getElementById('name').value,
        slug: document.getElementById('slug').value,
        price: parseFloat(document.getElementById('price').value),
        stock: parseInt(document.getElementById('stock').value, 10),
      };
      const salePrice = document.getElementById('sale_price').value;
      if (salePrice) body.sale_price = parseFloat(salePrice);
      const category = document.getElementById('category').value;
      if (category) body.category = category;
      const imageUrl = document.getElementById('image_url').value;
      if (imageUrl) body.image_url = imageUrl;

      const res = await adminFetch('/api/x/products', { method: 'POST', body: JSON.stringify(body) });
      if (res && res.ok) {
        e.target.reset();
        loadProducts();
      } else if (res) {
        const err = await res.json();
        alert(err.error || 'Could not add product');
      }
    });

    loadProducts();
  </script>
</body>
</html>
