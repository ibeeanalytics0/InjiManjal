<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Products - InjiManjal Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar" id="topbar"></div>
  <div class="container">
    <h2>Products</h2>

    <div class="card">
      <h3 id="formTitle">Add Product</h3>
      <form id="addForm">
        <input type="hidden" id="productId">
        <input type="text" id="name" placeholder="Name" required>
        <input type="text" id="slug" placeholder="slug-like-this" required>
        <input type="number" id="price" placeholder="Original price" step="0.01" required>
        <input type="number" id="sale_price" placeholder="Sale price (optional)" step="0.01">
        <input type="number" id="stock" placeholder="Stock" min="0" required>
        <input type="text" id="category" placeholder="Category">
        <input type="text" id="sku" placeholder="SKU (optional)">
        <input type="url" id="image_url" placeholder="Image URL">
        <textarea id="description" placeholder="Description"></textarea>
        <br><br>
        <button type="submit" id="submitBtn">Add Product</button>
        <button type="button" class="secondary" id="cancelEditBtn" style="display:none;">Cancel Edit</button>
      </form>
    </div>

    <div class="card">
      <table>
        <thead><tr><th>Name</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="productsBody"><tr><td colspan="5" class="empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

  <script src="admin.js"></script>
  <script>
    renderTopbar('products.html');
    let productsCache = [];

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;',
      }[character]));
    }

    function setFormMode(product = null) {
      document.getElementById('formTitle').textContent = product ? 'Edit Product' : 'Add Product';
      document.getElementById('submitBtn').textContent = product ? 'Save Product' : 'Add Product';
      document.getElementById('cancelEditBtn').style.display = product ? 'inline-block' : 'none';
      document.getElementById('productId').value = product?.id || '';
      document.getElementById('name').value = product?.name || '';
      document.getElementById('slug').value = product?.slug || '';
      document.getElementById('price').value = product?.price ?? '';
      document.getElementById('sale_price').value = product?.sale_price ?? '';
      document.getElementById('stock').value = product?.stock ?? '';
      document.getElementById('category').value = product?.category || '';
      document.getElementById('sku').value = product?.sku || '';
      document.getElementById('image_url').value = product?.image_url || '';
      document.getElementById('description').value = product?.description || '';
    }

    function editProduct(id) {
      const product = productsCache.find(p => p.id === id);
      if (!product) return alert('Product not found in the current list.');
      setFormMode(product);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function loadProducts() {
      const res = await adminFetch('/api/x/products');
      if (!res) return;
      const data = await res.json();
      productsCache = data.products || [];

      const tbody = document.getElementById('productsBody');
      if (productsCache.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty">No products yet</td></tr>';
        return;
      }

      tbody.innerHTML = productsCache.map(p => {
        const price = p.sale_price ? '<s>&#8377;' + p.price + '</s> &#8377;' + p.sale_price : '&#8377;' + p.price;
        const deleteButton = p.is_active ? '<button class="danger" type="button" onclick="deleteProduct(' + p.id + ')">Delete</button>' : '';
        return '<tr>' +
          '<td>' + escapeHtml(p.name) + '</td>' +
          '<td>' + price + '</td>' +
          '<td><div class="stock-control"><input type="number" id="stock-' + p.id + '" value="' + p.stock + '" min="0" step="1"><button type="button" onclick="updateStock(' + p.id + ')">Update</button></div></td>' +
          '<td>' + (p.is_active ? 'Active' : 'Inactive') + '</td>' +
          '<td><div class="table-actions"><button type="button" onclick="editProduct(' + p.id + ')">Edit</button><button class="secondary" type="button" onclick="toggleProductStatus(' + p.id + ', ' + (!p.is_active) + ')">' + (p.is_active ? 'Deactivate' : 'Activate') + '</button>' + deleteButton + '</div></td>' +
          '</tr>';
      }).join('');
    }

    async function updateStock(id) {
      const input = document.getElementById('stock-' + id);
      const stock = parseInt(input.value, 10);
      if (!Number.isInteger(stock) || stock < 0) return alert('Enter a valid stock number.');

      const res = await adminFetch('/api/x/products/' + id, { method: 'PUT', body: JSON.stringify({ stock }) });
      if (res && res.ok) return loadProducts();
      if (res) alert((await res.json()).error || 'Could not update stock');
    }

    async function toggleProductStatus(id, isActive) {
      if (!confirm((isActive ? 'Activate' : 'Deactivate') + ' this product?')) return;
      const res = await adminFetch('/api/x/products/' + id, { method: 'PUT', body: JSON.stringify({ is_active: isActive }) });
      if (res && res.ok) return loadProducts();
      if (res) alert((await res.json()).error || 'Could not update product status');
    }

    async function deleteProduct(id) {
      if (!confirm('Delete this product from the shop? Order history will be kept.')) return;
      const res = await adminFetch('/api/x/products/' + id, { method: 'DELETE' });
      if (res && res.ok) {
        if (document.getElementById('productId').value === String(id)) setFormMode();
        return loadProducts();
      }
      if (res) alert((await res.json()).error || 'Could not delete product');
    }

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const productId = document.getElementById('productId').value;
      const body = {
        name: document.getElementById('name').value.trim(),
        slug: document.getElementById('slug').value.trim(),
        price: parseFloat(document.getElementById('price').value),
        stock: parseInt(document.getElementById('stock').value, 10),
      };
      const salePrice = document.getElementById('sale_price').value;
      if (salePrice) body.sale_price = parseFloat(salePrice);
      if (productId && !salePrice) body.sale_price = null;
      const category = document.getElementById('category').value.trim();
      if (category) body.category = category;
      const sku = document.getElementById('sku').value.trim();
      if (sku) body.sku = sku;
      const imageUrl = document.getElementById('image_url').value.trim();
      if (imageUrl) body.image_url = imageUrl;
      const description = document.getElementById('description').value.trim();
      if (description) body.description = description;

      const endpoint = productId ? '/api/x/products/' + productId : '/api/x/products';
      const method = productId ? 'PUT' : 'POST';
      const res = await adminFetch(endpoint, { method, body: JSON.stringify(body) });
      if (res && res.ok) {
        e.target.reset();
        setFormMode();
        return loadProducts();
      }
      if (res) alert((await res.json()).error || (productId ? 'Could not update product' : 'Could not add product'));
    });

    document.getElementById('cancelEditBtn').addEventListener('click', () => {
      document.getElementById('addForm').reset();
      setFormMode();
    });

    loadProducts();
  </script>
</body>
</html>
