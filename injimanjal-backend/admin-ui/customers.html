<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Customers — InjiManjal Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar" id="topbar"></div>
  <div class="container">
    <h2>Customers</h2>
    <div class="card">
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th></tr></thead>
        <tbody id="customersBody"><tr><td colspan="4" class="empty">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>

  <script src="admin.js"></script>
  <script>
    renderTopbar('customers.html');

    (async () => {
      const res = await adminFetch('/api/x/customers');
      if (!res) return;
      const { customers } = await res.json();

      const tbody = document.getElementById('customersBody');
      if (customers.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">No customers yet</td></tr>';
        return;
      }

      tbody.innerHTML = customers.map(c => `
        <tr>
          <td>${c.name}</td>
          <td>${c.email}</td>
          <td>${c.phone || '—'}</td>
          <td>${new Date(c.created_at).toLocaleDateString()}</td>
        </tr>
      `).join('');
    })();
  </script>
</body>
</html>
